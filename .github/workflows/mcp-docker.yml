# MCP Server Docker Images — Build & Push
#
# Stages
# ──────
# 1. build-and-push  — Build lightweight Docker images for each MCP server and
#                      push to the GitHub Container Registry (ghcr.io) on every
#                      push to 'dev' or 'main' that touches mcp_server files.
#                      On pull requests the images are built (for validation)
#                      but not pushed.
#
# Images produced
# ───────────────
#   ghcr.io/markbujehein/vesuvio-mcp-environment  (environment_server.py)
#   ghcr.io/markbujehein/vesuvio-mcp-ads          (mantid_ads_server.py)
#   ghcr.io/markbujehein/vesuvio-mcp-log          (log_inspector_server.py)
#
# Each image is tagged with:
#   • latest       — always points to the most recent push on dev/main
#   • <git-sha>    — immutable, for reproducible deployments
#
# Phase 3 implementation reference: .devcontainer/research_audit.md §Phase 3

name: MCP Server — Build & Push Docker Images

on:
  push:
    branches:
      - dev
      - main
    paths:
      - "vesuvio_analysis/mcp_server/**"
      - "vesuvio_analysis/__init__.py"
  pull_request:
    branches:
      - dev
      - main
    paths:
      - "vesuvio_analysis/mcp_server/**"
      - "vesuvio_analysis/__init__.py"
  workflow_dispatch:

# Default: read-only.  Elevated permissions are scoped per-job below.
permissions:
  contents: read

jobs:
  build-and-push:
    name: Build & Push ${{ matrix.server.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # required to push to ghcr.io

    strategy:
      fail-fast: false
      matrix:
        server:
          - name: environment
            dockerfile: vesuvio_analysis/mcp_server/Dockerfile.environment-server
            image: vesuvio-mcp-environment
          - name: ads
            dockerfile: vesuvio_analysis/mcp_server/Dockerfile.ads-server
            image: vesuvio-mcp-ads
          - name: log
            dockerfile: vesuvio_analysis/mcp_server/Dockerfile.log-server
            image: vesuvio-mcp-log

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Extract Docker metadata (tags and labels)
      #    Tags: 'latest' on push to dev/main; short SHA for all events.
      # -----------------------------------------------------------------------
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.server.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
            type=sha,prefix=sha-,format=short

      # -----------------------------------------------------------------------
      # 3. Set up Docker Buildx (required for multi-platform builds and cache)
      # -----------------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -----------------------------------------------------------------------
      # 4. Authenticate to GHCR (push-only on main/dev; skipped on PRs)
      # -----------------------------------------------------------------------
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # 5. Build (and push on dev/main).
      #    Cache layers in the GitHub Actions cache to speed up subsequent
      #    builds when only the server source code changes.
      # -----------------------------------------------------------------------
      - name: Build and push ${{ matrix.server.name }} server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.server.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.server.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.server.image }}
