# Development Gate CI — fast feedback for PRs targeting the 'dev' branch.
#
# Stages
# ──────
# 1. Provision environment (pip + cache for speed)
# 2. Run Numba regression tests  (test_numba_regression.py)
# 3. Run iMinuit cross-check tests (test_iminuit_cross_check.py)
#    — includes the 5 % Numerical Agreement Gate (Sieve 3)
# 4. Run workspace safety tests   (test_workspace_safety.py)
#
# The workflow fails if any test reports values outside the tolerance
# defined in the test files (currently 1 % / 5 % depending on the gate).
#
# Total target execution time: < 3 minutes with a warm cache.

name: CI — Development Gate

on:
  pull_request:
    branches:
      - dev

jobs:
  dev-gate:
    name: Dev Gate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11"]

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Set up Python
      # -----------------------------------------------------------------------
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # -----------------------------------------------------------------------
      # 3. Restore / populate pip cache
      #    Key includes the OS, Python version, and a hash of pyproject.toml
      #    so the cache is invalidated when dependencies change.
      # -----------------------------------------------------------------------
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-py${{ matrix.python-version }}-

      # -----------------------------------------------------------------------
      # 4. Install dependencies
      #    Reads the dependency list from pyproject.toml (single source of
      #    truth for versions).  pytest is added explicitly as a test-only
      #    extra not listed in the package dependencies.
      # -----------------------------------------------------------------------
      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e .

      # -----------------------------------------------------------------------
      # 5. Numba regression gate
      #    Asserts NumPy vs Numba-accelerated paths agree to atol=1e-8 for
      #    all resolution kernels and the full NCP orchestrator.
      # -----------------------------------------------------------------------
      - name: Numba regression tests
        run: |
          python -m pytest tests/test_numba_regression.py -v --tb=short

      # -----------------------------------------------------------------------
      # 6. iMinuit / Scipy 5 % Agreement Gate (Sieve 3)
      #    Fails if iMinuit and scipy optimisers disagree by more than the
      #    tolerance defined in TestSieve3AgreementGate.
      # -----------------------------------------------------------------------
      - name: iMinuit cross-check tests (Sieve 3 — 5 % gate)
        run: |
          python -m pytest tests/test_iminuit_cross_check.py -v --tb=short

      # -----------------------------------------------------------------------
      # 7. Workspace safety tests (no Mantid required — mock ADS used)
      # -----------------------------------------------------------------------
      - name: Workspace safety tests
        run: |
          python -m pytest tests/test_workspace_safety.py -v --tb=short
